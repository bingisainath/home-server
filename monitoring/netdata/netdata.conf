# Minimal override; netdata applies its defaults for everything not listed here.
[plugin:proc]
    # This laptop's battery exposes no power_now, so the collector logged an error every second and
    # churned through the container's rotated logs. Battery telemetry is not useful on a server.
    # Note: proc modules are toggled here by path, NOT via `enabled` in their own
    # [plugin:proc:/sys/class/power_supply] section — that one only holds module settings.
    /sys/class/power_supply = no
