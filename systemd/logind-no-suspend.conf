# Drop-in: /etc/systemd/logind.conf.d/no-suspend.conf
#
# sleep.target, suspend.target and hibernate.target are already masked on this machine, so a suspend
# cannot actually happen. This makes the intent explicit rather than implicit: if those units are ever
# unmasked (a distro upgrade, someone tidying up), a headless server must still not go to sleep when
# its lid is shut or it is left idle.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
# Closing the lid on a server should not blank-then-lock its way into an idle suspend either.
IdleAction=ignore
